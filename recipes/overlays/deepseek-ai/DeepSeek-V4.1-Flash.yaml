        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        pcp: 1
        args:
          - --port
          - '7100'
          - --data-parallel-rpc-port
          - '12321'
          - --max-num-batched-tokens
          - '512'
          - --max-num-seqs
          - '72'
          - --gpu-memory-utilization
          - '0.97'
          - --additional-config
          - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true,"enable_flashcomm1":false}'
